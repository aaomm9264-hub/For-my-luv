<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary! ❤️</title>
    <style>
        body {
            background-color: #ffe6e8;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
            overflow-x: hidden;
        }
        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 117, 143, 0.2);
            max-width: 380px;
            margin: 0 auto;
            position: relative;
        }
        h1 { color: #ff4d6d; font-size: 22px; margin-bottom: 5px; }
        .sub-title { color: #888; font-size: 14px; margin-bottom: 15px; }
        
        /* กล่องข้อความ */
        #msg-box {
            margin: 20px auto;
            padding: 15px;
            background-color: #fff0f3;
            border-radius: 15px;
            border: 2px dashed #ffb3c1;
            font-weight: bold;
            color: #c9184a;
            font-size: 15px;
            line-height: 1.6;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* ปุ่มกดโต้ตอบ */
        .btn {
            background-color: #ff758f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(255, 117, 143, 0.4);
        }
        .btn:active { transform: scale(0.95); }

        /* เอฟเฟกต์หัวใจลอย */
        .heart-float {
            position: fixed;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 2s linear forwards;
            z-index: 999;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .step-count {
            font-size: 12px;
            color: #ff758f;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>สุขสันต์วันครบรอบ 2 เดือนน้าาา ❤️</h1>
        <div class="sub-title">มีจดหมายรัก 8 ฉบับส่งถึงเธอ 💌</div>

        <!-- กล่องแสดงข้อความ -->
        <div id="msg-box">👇 กดปุ่มข้างล่างเพื่อเปิดจดหมายฉบับแรก 👇</div>

        <!-- ปุ่มสำหรับกดอ่าน -->
        <button class="btn" id="love-btn" onclick="nextMessage()">เปิดจดหมายจากน้องออม 💖</button>
        <div class="step-count" id="step-text"></div>
    </div>

    <script>
        // รายการข้อความเรียงตามลำดับความรู้สึก
        const messages = [
            "ผ่านมา 2 เดือนแล้วนะแฟน ไวม๊ากกก ⏰✨",
            "ถึงเราจะไม่เคยเจอกันจริงๆ ไม่เคยสัมผัสกันเพราะอยู่ไกล...",
            "แต่เค้าก็ยังรู้สึกว่าอยู่กับเธอตลอดเวลานะ เธอเป็นคนแรกเลยที่เค้าทำอะไรแบบนี้ให้ 💋",
            "เค้าโชคดีมากๆๆๆเล้ยที่ได้มีเธออยู่ในชีวิต 🤍",
            "ขอบคุณนะที่ทนอยู่กับเค้ามาได้นานขนาดนี้ เค้าขอโทษที่ชอบเอาแต่ใจ ขี้งอน ขี้แง 🥲",
            "แต่เด็กขี้แงคนนี้ก็รักพี่เวฟแค่คนเดียวนะ ไม่เคยมองหาใครใหม่เข้ามาในชีวิตเลย 🔒❤️",
            "อยู่ด้วยกันไปนานๆนะ จนกว่าเราจะได้เจอกัน ได้อยู่บ้านหลังเดียวกัน ได้มีเด็กตัวเล็กๆที่หน้าตาคล้ายเราวิ่งเล่นในบ้าน 🏠👶🫶🏻",
            "เค้ารักแฟนที่สุดเลยยย อย่าพึ่งรีบเบื่อกันไปไหนนะ ถ้าแฟนไม่รักเค้า เค้าก็ไม่รู้จะไปรักใครแล้วจริงๆ 🥹💖"
        ];

        let currentIndex = 0;

        function nextMessage() {
            if (currentIndex < messages.length) {
                // เปลี่ยนข้อความ
                document.getElementById("msg-box").innerText = messages[currentIndex];
                
                // สร้างเอฟเฟกต์หัวใจลอย
                createFloatingHearts();

                currentIndex++;
                
                // อัปเดตข้อความบนปุ่ม
                if (currentIndex < messages.length) {
                    document.getElementById("love-btn").innerText = "อ่านฉบับถัดไป 💌";
                    document.getElementById("step-text").innerText = `ฉบับที่ ${currentIndex} / ${messages.length}`;
                } else {
                    document.getElementById("love-btn").innerText = "อ่านอีกรอบ 💕";
                    document.getElementById("step-text").innerText = "อ่านจบแล้วน้าาา รักพี่เวฟที่สุด! 🥰";
                }
            } else {
                // วนกลับไปเริ่มใหม่
                currentIndex = 0;
                nextMessage();
            }
        }

        // ฟังก์ชันปล่อยหัวใจลอยขึ้นฟ้า
        function createFloatingHearts() {
            const hearts = ["❤️", "💖", "💗", "💕", "🤍"];
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = document.createElement("div");
                    heart.className = "heart-float";
                    heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 80 + 10 + "vw";
                    heart.style.top = "80vh";
                    document.body.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 2000);
                }, i * 150);
            }
        }
    </script>

</body>
</html>
